name: Mantener Streamlit Despierto

on:
  schedule:
    # Se ejecuta cada 4 horas
    - cron: '0 */4 * * *'
  workflow_dispatch: # Permite probarlo manualmente con un botón

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Hacer petición HTTP a la app
        run: |
          curl -s -L --max-time 30 "https://anya-gestor-promociones-n8sxjsw9o5vyvz4hih7qhh.streamlit.app" || exit 0
