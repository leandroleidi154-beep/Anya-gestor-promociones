name: Mantener Streamlit Despierto

on:
  schedule:
    # Se ejecuta cada 6 horas (ajusta según tus necesidades)
    - cron: '0 */6 * * *'
  workflow_dispatch: # Permite probarlo manualmente desde GitHub

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Ejecutar script keep_alive
        run: python keep_alive.py
